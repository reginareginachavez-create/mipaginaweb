<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Avanzado con Datalist</title>
  
</head>
<body>
    
  <header>
    <h1>Sistema de Registro de Tecnologías</h1>
    <p>Formulario estructurado con autocompletado dinámico mediante <code>&lt;datalist&gt;</code>.</p>
  </header>

  <main>
    <form action="/procesar-datos" method="POST">
      
      
      <fieldset>
        <legend>Información de Preferencias Tecnográficas</legend>

        <p>
          <label for="sistema-operativo">Sistema Operativo Principal:</label>
          <br>
          <input 
            type="text" 
            id="sistema-operativo" 
            name="so_usuario" 
            list="lista-so" 
            placeholder="Ej. Ubuntu, Windows, macOS..." 
            autocomplete="off"
            aria-describedby="ayuda-so"
            required
          >
          <br>
          <small id="ayuda-so">Puedes seleccionar una opción sugerida o escribir una opción personalizada.</small>
        </p>

        <datalist id="lista-so">
          
          <select name="so_fallback">
            <option value="Windows 11">Windows 11 (Microsoft)</option>
            <option value="macOS Sequoia">macOS Sequoia (Apple)</option>
            <option value="Ubuntu Linux">Ubuntu Linux (Canonical)</option>
            <option value="Fedora">Fedora Workstation</option>
            <option value="Debian">Debian GNU/Linux</option>
            <option value="Arch Linux">Arch Linux</option>
            <option value="Android" disabled>Android (Solo Móvil - No disponible)</option>
          </select>
        </datalist>

        <p>
          <label for="comentarios">Comentarios adicionales:</label>
          <br>
          <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Escribe aquí..."></textarea>
        </p>

      </fieldset>

      <br>

      
      <button type="submit">Enviar Formulario</button>
      <button type="reset">Limpiar Campos</button>

    </form>
  </main>

  <footer>
    <p><small>Demostración de atributos nativos de HTML5.</small></p>
  </footer>

</body>
</html>
